[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fallbackledger"
version = "0.1.0"
description = "Replay declared fallback policies and trace simulation-study cohorts"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
authors = [{name = "FallbackLedger contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]

[project.scripts]
fallbackledger = "fallbackledger.cli:main"

[project.optional-dependencies]
test = ["pytest>=7", "build>=1", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
